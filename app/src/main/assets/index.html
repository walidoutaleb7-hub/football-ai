<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة مين اللاعب؟</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:active {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مين اللاعب؟ ⚽</h1>
        <p>مرحباً بك يا وليد في النسخة المطورة!</p>
        <div id="game-area">
            <p>جارٍ تحميل بيانات اللعبة...</p>
        </div>
        <button class="btn" onclick="alert('اللعبة تعمل بنجاح!')">اضغط للتجربة</button>
    </div>

</body>
</html>
