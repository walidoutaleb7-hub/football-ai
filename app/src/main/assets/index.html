<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تحدي كرة القدم</title>
    <!-- استدعاء خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }
        header {
            background: #2563eb;
            padding: 20px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s ease-in-out;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #475569;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        /* تصميم التبويبات السفلي */
        .nav-tabs {
            display: flex;
            background: #0f172a;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 0;
        }
        .tab-btn.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border-top: 2px solid #38bdf8;
        }
        /* بطاقات اللاعبين واللعبة */
        .player-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-info {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
        }
        .score-box {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>⚽ تحدي أساطير كرة القدم</header>

        <div class="content">
            <!-- شاشة إدخال الاسم (البداية) -->
            <div id="welcome-screen" class="screen active">
                <h2>أهلاً بك يا بطل!</h2>
                <p style="text-align: center; color: #94a3b8;">أدخل اسمك لتبدأ المغامرة وتدخل عالم التحديات الرياضية.</p>
                <input type="text" id="player-name-input" placeholder="اكتب اسمك هنا...">
                <button onclick="savePlayerName()">دخول اللعبة 🚀</button>
            </div>

            <!-- شاشة اللعبة الرئيسية -->
            <div id="game-screen" class="screen">
                <div class="score-box">
                    <span>اللاعب: <strong id="display-user-name" style="color: #38bdf8;"></strong></span>
                    <span>النقاط: <strong id="score" style="color: #22c55e;">0</strong></span>
                </div>
                <div class="player-card">
                    <p style="color: #94a3b8; font-size: 0.9rem;">تخمين اللاعب بناءً على بياناته:</p>
                    <div class="player-info" id="player-hint">جاري تحميل البيانات...</div>
                    <input type="text" id="guess-input" placeholder="اكتب اسم اللاعب المقترح...">
                    <button onclick="checkGuess()">تحقق من الإجابة ✅</button>
                    <button class="btn-secondary" onclick="nextPlayer()">تخطي / لاعب آخر ⏭️</button>
                </div>
            </div>

            <!-- شاشة الإعدادات -->
            <div id="settings-screen" class="screen">
                <h2>إعدادات التطبيق ⚙️</h2>
                <label style="color: #94a3b8;">تغيير اسم اللاعب:</label>
                <input type="text" id="settings-name-input">
                <button onclick="updateName()">حفظ التعديل 💾</button>
                
                <label style="color: #94a3b8; margin-top: 10px;">اختر المستوى:</label>
                <select id="level-select" onchange="changeLevel()">
                    <option value="easy">سهل (نجوم الصف الأول)</option>
                    <option value="medium">متوسط (دوريات كبرى + نجوم العرب)</option>
                    <option value="hard">صعب (لاعبو التحدي)</option>
                    <option value="legend">أساطير التاريخ</option>
                </select>

                <button class="btn-secondary" style="background: #ef4444; margin-top: 20px;" onclick="resetData()">إعادة ضبط التطبيق 🔄</button>
            </div>
        </div>

        <!-- شريط التبويبات السفلي للتحكم -->
        <nav class="nav-tabs" id="bottom-nav" style="display: none;">
            <button class="tab-btn active" onclick="switchTab('game', this)">🎮 اللعبة</button>
            <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ الإعدادات</button>
        </nav>
    </div>

    <script>
        // قاعدة بيانات داخلية مدمجة وقوية (لا تحتاج ملف خارجي تسبب مشاكل)
        const playersDatabase = [
            { name: "كريستيانو رونالدو", nationality: "البرتغال", level: "easy", position: "مهاجم" },
            { name: "ليونيل ميسي", nationality: "الأرجنتين", level: "easy", position: "مهاجم" },
            { name: "كيليان مبابي", nationality: "فرنسا", level: "easy", position: "مهاجم" },
            { name: "إيرلينغ هالاند", "nationality": "النرويج", "level": "easy", "position": "مهاجم" },
            { name: "محمد صلاح", nationality: "مصر", level: "easy", position: "مهاجم" },
            { name: "رياض محرز", nationality: "الجزائر", level: "medium", position: "مهاجم" },
            { name: "ريان آيت نوري", nationality: "الجزائر", level: "medium", position: "مدافع" },
            { name: "إسماعيل بن ناصر", nationality: "الجزائر", level: "medium", position: "وسط ميدان" },
            { name: "يوسف بلايلي", nationality: "الجزائر", level: "medium", position: "مهاجم" },
            { name: "بغداد بونجاح", nationality: "الجزائر", level: "medium", position: "مهاجم" },
            { name: "زين الدين زيدان", nationality: "فرنسا", level: "legend", position: "وسط ميدان" },
            { name: "رونالدينيو", nationality: "البرازيل", level: "legend", position: "وسط ميدان" },
            { name: "بيليه", nationality: "البرازيل", level: "legend", position: "مهاجم" },
            { name: "دييغو مارادونا", nationality: "الأرجنتين", level: "legend", position: "وسط ميدان" },
            { name: "كيفن دي بروين", nationality: "بلجيكا", level: "easy", position: "وسط ميدان" },
            { name: "جود بيلينغهام", nationality: "إنجلترا", level: "easy", position: "وسط ميدان" },
            { name: "نيكولو باريلا", nationality: "إيطاليا", level: "hard", position: "وسط ميدان" },
            { name: "ويليام ساليبا", nationality: "فرنسا", level: "hard", position: "مدافع" }
        ];

        let currentPlayer = null;
        let score = 0;
        let currentLevelFilter = "easy";

        // التحقق من وجود اسم مخزن مسبقاً عند فتح التطبيق
        window.onload = function() {
            const savedName = localStorage.getItem("playerName");
            if (savedName) {
                document.getElementById("display-user-name").innerText = savedName;
                document.getElementById("settings-name-input").value = savedName;
                showGameScreen();
            }
        };

        function savePlayerName() {
            const nameInput = document.getElementById("player-name-input").value.trim();
            if (nameInput === "") {
                alert("من فضلك اكتب اسمك أولاً!");
                return;
            }
            localStorage.setItem("playerName", nameInput);
            document.getElementById("display-user-name").innerText = nameInput;
            document.getElementById("settings-name-input").value = nameInput;
            showGameScreen();
        }

        function showGameScreen() {
            document.getElementById("welcome-screen").classList.remove("active");
            document.getElementById("settings-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("bottom-nav").style.display = "flex";
            nextPlayer();
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("settings-screen").classList.remove("active");

            if (tabName === 'game') {
                document.getElementById("game-screen").classList.add("active");
            } else if (tabName === 'settings') {
                document.getElementById("settings-screen").classList.add("active");
            }
        }

        function nextPlayer() {
            // فلترة اللاعبين حسب المستوى المختار
            const filtered = playersDatabase.filter(p => p.level === currentLevelFilter);
            if (filtered.length === 0) {
                currentPlayer = playersDatabase[Math.floor(Math.random() * playersDatabase.length)];
            } else {
                currentPlayer = filtered[Math.floor(Math.random() * filtered.length)];
            }
            
            // عرض التلميح للمستخدم (الجنسية والمركز)
            document.getElementById("player-hint").innerHTML = `🌍 الجنسية: ${currentPlayer.nationality} <br> 📍 المركز: ${currentPlayer.position}`;
            document.getElementById("guess-input").value = "";
        }

        function checkGuess() {
            const userGuess = document.getElementById("guess-input").value.trim();
            if (!userGuess) return;

            if (userGuess.toLowerCase() === currentPlayer.name.toLowerCase()) {
                score += 10;
                document.getElementById("score").innerText = score;
                alert("🎉 إجابة صحيحة! أحسنت يا بطل.");
                nextPlayer();
            } else {
                alert("❌ إجابة خاطئة، حاول مرة أخرى!");
            }
        }

        function updateName() {
            const newName = document.getElementById("settings-name-input").value.trim();
            if (newName) {
                localStorage.setItem("playerName", newName);
                document.getElementById("display-user-name").innerText = newName;
                alert("✅ تم تحديث الاسم بنجاح!");
            }
        }

        function changeLevel() {
            currentLevelFilter = document.getElementById("level-select").value;
            nextPlayer();
        }

        function resetData() {
            if (confirm("هل أنت متأكد من إعادة ضبط التطبيق؟")) {
                localStorage.removeItem("playerName");
                location.reload();
            }
        }
    </script>
</body>
</html>
