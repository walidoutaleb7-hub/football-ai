<!DOCTYPE html>                                        <html lang="ar" dir="rtl">                             <head>                                                 <meta charset="UTF-8">                                 <meta name="viewport" content="width=device-width, initial-scale=1.0">                                                                                               <title>من هو اللاعب؟</title>                                                                                  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">                                                                                                       <style>                                                *{                                                         box-sizing:border-box;                             }                                                                                                             body{                                                      margin:0;                                              min-height:100vh;                                      font-family:'Tajawal',Arial,sans-serif;                color:white;                                           overflow:hidden;                                                                                              background:                                                radial-gradient(circle at 50% 15%,#174d72 0%,transparent 35%),                                                radial-gradient(circle at 15% 90%,#123f35 0%,transparent 35%),                                                linear-gradient(145deg,#03070d,#071b2b,#03130f);                                                                                                                 display:flex;                                          justify-content:center;                                align-items:center;                                }                                                                                                             /* النجوم */                                           body::before{                                              content:"";                                            position:fixed;                                        inset:0;                                               opacity:.35;                                           pointer-events:none;                                                                                          background-image:                                          radial-gradient(circle,#fff 1px,transparent 1px),                                                             radial-gradient(circle,#fff 1px,transparent 1px);                                                                                                                background-size:90px 90px,140px 140px;                                                                        animation:stars 20s linear infinite;               }                                                                                                             @keyframes stars{                                          from{transform:translateY(0)}                          to{transform:translateY(-90px)}                    }                                                                                                             .screen{                                                   width:92%;                                             max-width:450px;                                       text-align:center;                                     position:relative;                                     z-index:2;                                         }                                                                                                             /* ⚙️ الإعدادات */                                      .settings{                                                 position:fixed;                                        top:18px;                                              left:18px;                                             z-index:10;                                        }                                                                                                             .settings-btn{                                             width:48px;                                            height:48px;                                           padding:0;                                             margin:0;                                                                                                     border-radius:50%;                                     background:rgba(255,255,255,.1);                       border:1px solid rgba(255,255,255,.12);                                                                       color:white;                                           font-size:22px;                                                                                               backdrop-filter:blur(10px);                        }                                                                                                             .settings-menu{                                            position:absolute;                                     top:58px;                                              left:0;                                                                                                       width:220px;                                           padding:15px;                                                                                                 border-radius:20px;                                                                                           background:rgba(8,20,32,.94);                          border:1px solid rgba(255,255,255,.1);                                                                        box-shadow:0 20px 50px rgba(0,0,0,.5);                                                                        display:none;                                          text-align:right;                                  }                                                                                                             .settings-menu.show{                                       display:block;                                         animation:menuIn .25s ease;                        }                                                                                                             @keyframes menuIn{                                         from{                                                      opacity:0;                                             transform:translateY(-8px) scale(.96);             }                                                      to{                                                        opacity:1;                                             transform:translateY(0) scale(1);                  }                                                  }                                                                                                             .settings-title{                                           font-size:18px;                                        font-weight:900;                                       margin-bottom:12px;                                }                                                                                                             .setting{                                                  padding:10px 5px;                                      border-bottom:1px solid rgba(255,255,255,.08);         font-size:14px;                                    }                                                                                                             .setting:last-child{                                       border-bottom:0;                                   }                                                                                                             .setting button{                                           margin-top:8px;                                        padding:9px;                                           font-size:14px;                                    }                                                                                                             /* الشعار */                                           .logo{                                                     font-size:75px;                                        filter:drop-shadow(0 0 25px rgba(30,220,150,.55));                                                            animation:                                                 floating 3s ease-in-out infinite,                      glow 2s ease-in-out infinite alternate;        }                                                                                                             @keyframes floating{                                       0%,100%{                                                   transform:translateY(0) rotate(0);                 }                                                      50%{                                                       transform:translateY(-10px) rotate(5deg);          }                                                  }                                                                                                             @keyframes glow{                                           from{                                                      filter:drop-shadow(0 0 10px rgba(30,220,150,.3));                                                         }                                                      to{                                                        filter:drop-shadow(0 0 30px rgba(30,220,150,.8));                                                         }                                                  }                                                                                                             h1{                                                        font-size:35px;                                        font-weight:900;                                       margin:5px 0;                                      }                                                                                                             .subtitle{                                                 color:#a9bdce;                                         font-size:15px;                                        margin-bottom:25px;                                }                                                                                                             /* البطاقة */                                          .card{                                                     padding:28px 22px;                                                                                            border-radius:28px;                                                                                           background:rgba(10,25,40,.75);                         border:1px solid rgba(255,255,255,.1);                                                                        backdrop-filter:blur(18px);                                                                                   box-shadow:                                                0 25px 70px rgba(0,0,0,.5),                            inset 0 1px rgba(255,255,255,.08);                                                                        animation:cardIn .7s ease;                         }                                                                                                             @keyframes cardIn{                                         from{                                                      opacity:0;                                             transform:translateY(25px) scale(.96);             }                                                      to{                                                        opacity:1;                                             transform:translateY(0) scale(1);                  }                                                  }                                                                                                             #question{                                                 min-height:90px;                                                                                              display:flex;                                          align-items:center;                                    justify-content:center;                                                                                       font-size:23px;                                        line-height:1.6;                                       font-weight:800;                                                                                              margin:0 0 20px;                                   }                                                                                                             /* الأزرار */                                          button{                                                    width:100%;                                            padding:16px;                                                                                                 margin:8px 0;                                                                                                 border:0;                                              border-radius:17px;                                                                                           font-family:inherit;                                   font-size:18px;                                        font-weight:800;                                                                                              color:white;                                                                                                  cursor:pointer;                                                                                               transition:                                                transform .15s,                                        filter .15s,                                           box-shadow .15s;                               }                                                                                                             button:active{                                             transform:scale(.95);                              }                                                                                                             #startButton{                                              background:linear-gradient(135deg,#20d58a,#078160);                                                           box-shadow:                                                0 10px 30px rgba(20,210,130,.3);               }                                                                                                             #startButton:hover{                                        transform:translateY(-3px);                            filter:brightness(1.15);                           }                                                                                                             .answer{                                                   background:rgba(255,255,255,.08);                      border:1px solid rgba(255,255,255,.08);            }                                                                                                             .answer:hover{                                             transform:translateY(-3px);                            background:rgba(255,255,255,.14);                  }                                                                                                             .hidden{                                                   display:none;                                      }                                                                                                             #result{                                                   font-size:25px;                                        font-weight:900;                                       margin:20px 0;                                     }                                                                                                             #playerImage{                                              width:190px !important;                                height:250px !important;                                                                                      object-fit:cover;                                                                                             border-radius:22px;                                                                                           border:2px solid rgba(255,255,255,.15);                                                                       box-shadow:0 15px 45px rgba(0,0,0,.55);                                                                       animation:playerIn .6s ease;                       }                                                                                                             @keyframes playerIn{                                       from{                                                      opacity:0;                                             transform:scale(.75);                              }                                                      to{                                                        opacity:1;                                             transform:scale(1);                                }                                                  }                                                                                                             .footer{                                                   margin-top:18px;                                       color:#718397;                                         font-size:12px;                                    }                                                      body.light{                                                background:linear-gradient(145deg,#e8f4ff,#dff7ec);    color:#102030;                                     }                                                                                                             body.light .card{                                          background:rgba(255,255,255,.75);                      color:#102030;                                     }                                                                                                             body.light .subtitle{                                      color:#526575;                                     }                                                      body.no-effects *,                                     body.no-effects *::before,                             body.no-effects *::after{                                  animation:none !important;                             transition:none !important;                        }                                                      </style>                                               </head>                                                                                                       <body>                                                                                                        <!-- ⚙️ الإعدادات -->                                   <div class="settings">                                                                                            <button class="settings-btn" onclick="toggleSettings()">                                                          ⚙️                                                  </button>                                                                                                     <div class="settings-menu" id="settingsMenu">                                                                     <div class="settings-title">                               ⚙️ الإعدادات                                        </div>                                                                                                        <div class="setting">                                      🎨 المظهر                                              <button onclick="toggleTheme()">                           🌙 تبديل المظهر                                    </button>                                          </div>                                                                                                        <div class="setting">                                      🔊 الأصوات                                             <button onclick="toggleSound()" id="soundBtn">                                                                    🔊 مفعّلة                                           </button>                                          </div>                                                                                                        <div class="setting">                                      ✨ المؤثرات                                            <button onclick="toggleEffects()" id="effectsBtn">                                                                ✨ مفعّلة                                           </button>                                          </div>                                                                                                    </div>                                                                                                    </div>                                                                                                        <div class="screen">                                                                                              <div class="logo">⚽</div>                                                                                    <h1>من هو اللاعب؟</h1>                                                                                        <div class="subtitle">                                     فكّر في لاعب كرة قدم، وسأحاول اكتشافه 🤖            </div>                                                                                                        <div class="card">                                                                                                <div id="startScreen">                                                                                            <p>                                                        اختر لاعبًا في ذهنك ولا تخبرني به 👀                </p>                                                                                                          <button id="startButton">                                  🎮 ابدأ اللعبة                                     </button>                                                                                                 </div>                                                                                                        <div id="gameScreen" class="hidden">                                                                              <div id="question"></div>                                                                                     <button class="answer" onclick="playSound('yes'); answer('yes')">                                                 ✅ نعم                                             </button>                                              <button class="answer" onclick="playSound('no'); answer('no')">                                                   ❌ لا                                              </button>                                                                                                     <div id="result"></div>                                                                                       <img id="playerImage" style="display:none;">                                                                                                                     </div>                                                                                                    </div>                                                                                                        <div class="footer">                                        صُنع بشغف بواسطة Walid Outaleb                     </div>                                                                                                    </div>                                                                                                        <script>                                                                                                      let gameId=null;                                       let audioCtx=null;                                                                                            function playSound(type){                                  if(!soundEnabled) return;                                                                                     if(!audioCtx){                                             audioCtx=new (window.AudioContext||window.webkitAudioContext)();                                          }                                                                                                             const osc=audioCtx.createOscillator();                 const gain=audioCtx.createGain();                                                                             osc.connect(gain);                                     gain.connect(audioCtx.destination);                                                                           osc.frequency.value=type==="yes"?700:300;              gain.gain.value=0.08;                                                                                         osc.start();                                           osc.stop(audioCtx.currentTime+0.12);               }                                                      let soundEnabled=true;                                 let effectsEnabled=true;                                                                                      function toggleSettings(){                                                                                        document                                                   .getElementById("settingsMenu")                        .classList.toggle("show");                                                                            }                                                                                                             function toggleSound(){                                                                                           soundEnabled=!soundEnabled;                                                                                   document                                                   .getElementById("soundBtn")                            .textContent=                                          soundEnabled                                           ?"🔊 مفعّلة"                                            :"🔇 متوقفة";                                                                                         }                                                                                                             function toggleEffects(){                                                                                         effectsEnabled=!effectsEnabled;                                                                               document                                                   .getElementById("effectsBtn")                          .textContent=effectsEnabled                            ?"✨ مفعّلة"                                            :"💤 متوقفة";                                                                                             document.body.classList.toggle(                            "no-effects",                                          !effectsEnabled                                    );                                                 }                                                      function toggleTheme(){                                                                                           document.body.classList.toggle("light");                                                                  }                                                                                                             document.getElementById("startButton").onclick=async()=>{                                                                                                                const r=await fetch("/new-game",{                          method:"POST"                                      });                                                                                                           const d=await r.json();                                                                                       if(d.success){                                                                                                    gameId=d.gameId;                                                                                              document                                                   .getElementById("startScreen")                         .classList.add("hidden");                                                                                 document                                                   .getElementById("gameScreen")                          .classList.remove("hidden");                                                                              document                                                   .getElementById("question")                            .textContent=d.question;                                                                              }                                                                                                         };                                                                                                            async function answer(value){                                                                                     if(!gameId)return;                                                                                            const r=await fetch("/question",{                                                                                 method:"POST",                                                                                                headers:{                                                  "Content-Type":"application/json"                  },                                                                                                            body:JSON.stringify({                                      gameId,                                                answer:value                                       })                                                                                                        });                                                                                                           const d=await r.json();                                                                                       if(d.finished){                                                                                                   document                                                   .getElementById("question")                            .textContent=                                          "🤖 أعتقد أن اللاعب هو:";                                                                                 document                                                   .getElementById("result")                              .textContent=                                          d.player                                               ?"⚽ "+d.player                                        :"😅 لم أتمكن من معرفة اللاعب";                                                                           if(d.imageUrl){                                                                                                   const img=                                                 document.getElementById("playerImage");                                                                   img.src=d.imageUrl;                                                                                           img.style.display="block";                                                                                }                                                                                                             document                                                   .querySelectorAll(".answer")                           .forEach(                                                  b=>b.style.display="none"                          );                                                                                                    }else{                                                                                                            document                                                   .getElementById("question")                            .textContent=d.question;                                                                              }                                                                                                         }                                                                                                             </script>                                                                                                     </body>                                                </html>
