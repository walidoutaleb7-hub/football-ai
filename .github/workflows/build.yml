name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate players database
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python generate_players.py

      - name: Show players count
        run: |
          python -c "import json; data=json.load(open('popular_players.json', encoding='utf-8')); print('Players:', len(data))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: football-ai-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Check APK
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK was not generated"
            exit 1
          fi